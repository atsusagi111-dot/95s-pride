# GitHub に push したら、テストを通してから Cloudflare へ自動で公開する
# 必要な設定(GitHub の Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  … Cloudflare の API トークン(Workers と D1 の編集権限)
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウントID
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    # main に push されたときだけ公開する(pull request では公開しない)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run build
      # D1 の新しい migrations を先に当ててから Worker を公開する
      - run: npx wrangler d1 migrations apply 95s-pride --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
