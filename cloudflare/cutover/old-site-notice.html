<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>新しいサイトに引っ越しました | 95s PRIDE</title>
  <link rel="icon" href="https://95s-pride.inquiry-router.workers.dev/assets/logo-mark.svg" type="image/svg+xml">
  <style>
    :root { --ink: #1f2a26; --muted: #5d6b65; --green: #1f5c4a; --green-dark: #174536; --bg: #f1f4f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; }
    .card { width: 100%; max-width: 520px; background: #fff; border-radius: 16px; padding: 40px 28px 32px; text-align: center; box-shadow: 0 6px 24px rgba(31, 42, 38, .08); }
    .logo { width: 88px; height: 88px; margin: 0 auto 16px; display: block; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; line-height: 1.5; color: var(--green); }
    p { margin: 0 0 16px; }
    .button { display: block; margin: 24px auto 8px; padding: 16px 20px; border-radius: 999px; background: var(--green); color: #fff; font-size: 1.1rem; font-weight: 700; text-decoration: none; }
    .button:hover, .button:focus-visible { background: var(--green-dark); }
    .url { margin: 0 0 24px; font-size: .85rem; color: var(--muted); word-break: break-all; }
    .note { margin: 0; padding-top: 20px; border-top: 1px solid #e3e8e5; font-size: .9rem; color: var(--muted); text-align: left; }
    .note li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://95s-pride.inquiry-router.workers.dev/assets/logo.png" alt="95s PRIDE">
    <h1>95s PRIDE は、新しいサイトに<br>引っ越しました</h1>
    <p>このページは、旧サイトです。<br>これからは、新しいサイトをご利用ください。</p>
    <a class="button" id="go" href="https://95s-pride.inquiry-router.workers.dev/">新しいサイトはこちら</a>
    <p class="url" id="goUrl">https://95s-pride.inquiry-router.workers.dev/</p>
    <ul class="note">
      <li>ログインのメールアドレスとパスワードは、そのままお使いいただけます。</li>
      <li>最初の1回だけ、ログインし直しが必要です。</li>
      <li>ブックマークしている方は、新しいURLに登録し直してください。</li>
    </ul>
  </main>
  <script>
    // 開いたページと同じページが新サイトにあれば、そこへ案内する(例: /members → 新サイトの /members)
    (function () {
      var NEW_SITE = 'https://95s-pride.inquiry-router.workers.dev';
      var path = location.pathname;
      // API や不明な場所は、トップへ案内する
      if (path.indexOf('/api/') === 0 || path === '/index.html') path = '/';
      var target = NEW_SITE + path + location.search + location.hash;
      document.getElementById('go').href = target;
      document.getElementById('goUrl').textContent = target;
    })();
  </script>
</body>
</html>
